# Trocket — XcodeGen 工程定义
#
# 注意：本文件是**模板**。`@TEAM_ID@` 与 `@BUNDLE_PREFIX@` 由 scripts/bootstrap.sh
# 替换后生成 project.generated.yml，再用 xcodegen 生成 Trocket.xcodeproj。
# 不要直接 `xcodegen generate`（占位符不会被替换，签名与 App Group 会错）。
name: Trocket

options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: "@TEAM_ID@"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    ENABLE_BITCODE: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    GCC_WARN_UNDECLARED_SELECTOR: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO

targets:
  Trocket:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Resources
        excludes:
          - "RuleSets/**"
      # 内置分流规则集：用文件夹引用整包拷进 bundle（RuleSets/geosite-cn.srs …），
      # 首次启动由 RuleSetStore 拷进 App Group 容器供内核加载（见 RuleSetStore.swift）
      - path: Resources/RuleSets
        type: folder
        buildPhase: resources
    dependencies:
      - target: TrocketTunnel
        embed: true
        codeSign: true
      - framework: Vendor/Libbox.xcframework
        embed: false
        codeSign: false
      # libbox 的 Go net 包依赖 libresolv 的 res_9_* 符号
      - sdk: libresolv.tbd
    info:
      path: Support/Trocket-Info.plist
      properties:
        CFBundleDisplayName: Trocket
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        TrocketAppGroup: group.@BUNDLE_PREFIX@.trocket
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Support/Trocket.entitlements
      properties:
        com.apple.security.application-groups:
          - group.@BUNDLE_PREFIX@.trocket
        # 主 App 也要声明网络扩展能力：否则 NETunnelProviderManager
        # 的 loadAllFromPreferences / startVPNTunnel 一律返回 permission denied
        # （实测；上游 sing-box-for-apple 的主 App 同样带这一条）
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "@BUNDLE_PREFIX@.trocket"
        PRODUCT_NAME: Trocket
        # XcodeGen 默认给 target 写 "1,2"（iPhone+iPad），会压过工程级设置；
        # App Store 校验要求支持 iPad 多任务时必须四个方向全开，我们只做竖屏，所以显式锁成 iPhone-only。
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor

  TrocketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Tunnel
      - path: Sources/Shared
    dependencies:
      - framework: Vendor/Libbox.xcframework
        embed: false
        codeSign: false
      - sdk: libresolv.tbd
    info:
      path: Support/TrocketTunnel-Info.plist
      properties:
        CFBundleDisplayName: Trocket Tunnel
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        TrocketAppGroup: group.@BUNDLE_PREFIX@.trocket
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Support/TrocketTunnel.entitlements
      properties:
        com.apple.security.application-groups:
          - group.@BUNDLE_PREFIX@.trocket
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "@BUNDLE_PREFIX@.trocket.tunnel"
        PRODUCT_NAME: TrocketTunnel
        TARGETED_DEVICE_FAMILY: "1"
        # 网络扩展里没有 UIApplication。若用 INCLUDE_NAIVE=1 构建内核（含 Cronet），
        # 这两个符号需要被允许为未定义（相关代码路径仅用于 App 内的后台任务）。
        OTHER_LDFLAGS:
          - "-Wl,-U,_OBJC_CLASS_$_UIApplication"
          - "-Wl,-U,_UIBackgroundTaskInvalid"

  TrocketTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TrocketTests
        excludes:
          - "Fixtures/**"
      - path: Tests/TrocketTests/Fixtures
        buildPhase: resources
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "@BUNDLE_PREFIX@.trocket.tests"
        PRODUCT_NAME: TrocketTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Trocket:
    build:
      targets:
        Trocket: all
        TrocketTunnel: all
        TrocketTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TrocketTests
  TrocketTunnel:
    build:
      targets:
        TrocketTunnel: all
    run:
      config: Debug
