<h1>Trocket 支持</h1>
<p>Trocket 是本地运行的网络代理客户端，需要你自备订阅链接。</p>
<h2>常见问题</h2>
<p><b>打开开关后无法上网？</b>先在应用内点「测速」：若某条线路有延迟数值，手动选中它再连接；若全部显示无延迟，说明订阅节点不可用或已过期。</p>
<p><b>如何排查？</b>菜单 →「诊断日志」→「一键拷贝全部日志」，把日志发给你的服务商或技术支持。</p>
<p><b>会收集我的数据吗？</b>不会，详见隐私政策。</p>
